<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASM Video Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="loginPage" class="page">
    <div class="login-box">
      <h2>Login</h2>
      <input type="text" id="username" placeholder="Enter your name">
      <button onclick="login()">Login</button>
    </div>
  </div>

  <!-- Main Website -->
  <div id="mainPage" class="page hidden">
    <header>
      <h1>🎥 ASM Video Hub</h1>
      <p>Welcome, <span id="currentUser"></span></p>
    </header>

    <section class="upload">
      <h2>Share a Video</h2>
      <input type="url" id="videoUrl" placeholder="Paste YouTube/Instagram URL">
      <button onclick="shareVideo()">Share</button>
    </section>

    <section class="videos">
      <h2>Videos</h2>
      <div id="videoList"></div>
    </section>

    <section class="requests">
      <h2>Video Requests</h2>
      <input type="text" id="requestText" placeholder="Ask for a video...">
      <button onclick="addRequest()">Request</button>
      <ul id="requestList"></ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
